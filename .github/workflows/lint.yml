name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Python validators
        run: |
          python -m pip install "$(python -c 'import tomllib; print("uv==" + next(p["version"] for p in tomllib.load(open("uv.lock", "rb"))["package"] if p["name"] == "uv"))')"
          uv sync --locked
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install --global "$(node -p "'pnpm@' + require('./package.json').devDependencies.pnpm")"
      - name: Install n8n validator
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate JSON
        run: git ls-files -z '*.json' | xargs -0 uv run --locked check-json
      - name: Validate YAML
        run: git ls-files -z '*.yml' '*.yaml' | xargs -0 uv run --locked check-yaml --allow-multiple-documents
      - name: Validate n8n workflows
        run: |
          node <<'JS'
          const { globSync, readFileSync } = require('node:fs');
          const { workflow, validateWorkflowBuilder } = require('@n8n/workflow-sdk');
          for (const file of globSync('automations/**/*.json')) {
            const result = validateWorkflowBuilder(workflow.fromJSON(JSON.parse(readFileSync(file, 'utf8'))));
            for (const issue of result.issues) {
              console.error(`${file}: ${issue.severity} ${issue.code}: ${issue.message}`);
            }
            if (!result.valid) process.exitCode = 1;
          }
          JS
